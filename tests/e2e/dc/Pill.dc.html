<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head>
<body><x-dc><helmet><style>.pillc{display:inline-block}</style></helmet>
<span class="pillc" style="border: 1px solid {{tone}}">{{label}}!</span></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"x"},"tone":{"editor":"color","default":"#000"}}'>
class Component extends DCLogic { renderVals() { return { label: this.props.label ?? 'x', tone: this.props.tone ?? '#000' }; } }
</script></body></html>
