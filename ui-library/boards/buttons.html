<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buttons</title><link rel="stylesheet" href="../_shared/css/tokens.css"><link rel="stylesheet" href="../_shared/css/components.css"><body><main class="sc"><section><h2>Variants</h2><div class="sc-row">
<button class="ui-btn" data-variant="default">default</button>
<button class="ui-btn" data-variant="secondary">secondary</button>
<button class="ui-btn" data-variant="outline">outline</button>
<button class="ui-btn" data-variant="ghost">ghost</button>
<button class="ui-btn" data-variant="destructive">destructive</button>
<button class="ui-btn" data-variant="link">link</button>
</div></section>
<section><h2>Sizes</h2><div class="sc-row">
<button class="ui-btn" data-variant="default" data-size="xs">xs</button>
<button class="ui-btn" data-variant="default" data-size="sm">sm</button>
<button class="ui-btn" data-variant="default">default</button>
<button class="ui-btn" data-variant="default" data-size="lg">lg</button>
</div></section>
<section><h2>With icon · icon only</h2><div class="sc-row">
<button class="ui-btn" data-variant="default"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg> New artifact</button>
<button class="ui-btn" data-variant="outline" data-size="sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg> Invite</button>
<button class="ui-btn" data-variant="outline" data-size="icon" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
<button class="ui-btn" data-variant="ghost" data-size="icon-sm" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
<button class="ui-btn" data-variant="ghost" data-size="icon-xs" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
</div></section>
<section><h2>States · focus ring, disabled</h2><div class="sc-row">
<button class="ui-btn ui-focus" data-variant="default">Focused</button>
<button class="ui-btn" data-variant="outline" disabled>Disabled</button>
<button class="ui-btn" data-variant="default" disabled>Disabled</button>
</div></section>
<section><h2>Pressed · toggled · loading · quiet destructive</h2><div class="sc-row">
<button class="ui-btn" data-variant="default" style="transform:translateY(1px);box-shadow:inset 0 0 0 999px rgb(0 0 0 / .16)">Pressed</button>
<button class="ui-btn" data-variant="outline" aria-pressed="true">Toggled on</button>
<button class="ui-btn" data-variant="default" data-loading aria-busy="true">Publishing</button>
<button class="ui-btn" data-variant="outline" data-loading aria-busy="true">Saving</button>
<button class="ui-btn" data-variant="destructive-quiet">Delete artifact</button>
</div></section>
<section><h2>Button group</h2><div class="ui-btn-group">
<button class="ui-btn" data-variant="outline" data-size="sm">Light</button><button class="ui-btn" data-variant="outline" data-size="sm">System</button><button class="ui-btn" data-variant="outline" data-size="sm">Dark</button>
</div></section>
</main></body></html>
