<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlays</title><link rel="stylesheet" href="../_shared/css/tokens.css"><link rel="stylesheet" href="../_shared/css/components.css"><body><main class="sc"><div class="sc-row" style="align-items:flex-start;gap:24px">
<div><h2>Dropdown / context menu</h2><div class="ui-menu" role="menu"><div class="ui-menu-label">Artifact</div><hr class="ui-separator">
<button class="ui-menu-item" role="menuitem" data-highlighted><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>Duplicate<span class="ui-menu-shortcut">⌘D</span></button>
<button class="ui-menu-item" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Share files…</button>
<button class="ui-menu-item" role="menuitem" aria-haspopup="menu">Move to workspace</button><button class="ui-menu-item" role="menuitemcheckbox" aria-checked="true">Pinned</button><hr class="ui-separator">
<button class="ui-menu-item" role="menuitem" data-variant="destructive">Delete<span class="ui-menu-shortcut">⌫</span></button></div></div>
<div><h2>Popover</h2><div class="ui-popover"><div class="ui-field"><label class="ui-label" for="p1">Board name</label><input id="p1" class="ui-input" value="Home"></div></div></div>
<div><h2>Command palette</h2><div class="ui-command"><div class="ui-command-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="Type a command…" aria-label="Command"></div>
<div class="ui-command-list"><div class="ui-command-group">Boards</div><button class="ui-menu-item" data-highlighted>Home</button><button class="ui-menu-item">Settings</button><div class="ui-command-group">Actions</div><button class="ui-menu-item">Present<span class="ui-menu-shortcut">P</span></button></div><div class="ui-command-foot"><span><span class="ui-kbd">&#8593;&#8595;</span> move</span><span><span class="ui-kbd">&#8629;</span> open</span><span><span class="ui-kbd">esc</span> close</span></div></div></div>
</div>
<section><h2>Dialog</h2><div class="sc-stage" style="background:color-mix(in srgb,var(--foreground) 50%,transparent)"><div class="ui-dialog" role="dialog" aria-labelledby="d1">
<div><h3 class="ui-dialog-title" id="d1">Delete artifact?</h3><p class="ui-dialog-desc">All versions and comments are removed. This cannot be undone.</p></div>
<div class="ui-dialog-footer"><button class="ui-btn" data-variant="outline">Cancel</button><button class="ui-btn" data-variant="destructive">Delete</button></div></div></div></section>
</main></body></html>
