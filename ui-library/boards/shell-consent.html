<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approve access</title><link rel="stylesheet" href="../_shared/css/tokens.css"><link rel="stylesheet" href="../_shared/css/components.css"><link rel="stylesheet" href="../_shared/css/shells.css"><link rel="stylesheet" href="../_shared/css/flows/core.css"><link rel="stylesheet" href="../_shared/css/flows/consent.css"><body><div class="shell-page" data-center><div class="ui-card gate" data-wide style="max-width:480px"><div class="ui-card-header" style="display:block"><div style="display:flex;align-items:center;gap:12px"><span class="tile"><svg class="i" aria-hidden="true"><use href="../icons.svg#plug"/></svg></span><div style="min-width:0"><h1 class="ui-card-title" style="font-size:18px;line-height:1.3">Claude Desktop wants to connect</h1><p class="ui-help">Signed in as Christian · owner <button class="ui-btn" data-variant="link" data-size="sm" style="height:auto">Not you?</button></p></div></div></div><div class="ui-card-content stackf-lg"><fieldset class="presets"><legend class="ui-label" style="margin-bottom:8px">What may Claude Desktop do?</legend><label class="preset"><input class="ui-radio" type="radio" name="preset" value="read"><span class="preset-title">Look only</span><span class="preset-desc">Open artifacts, files, comments and shared data. Nothing can be changed.</span><span class="preset-scopes"><span class="ui-badge" data-variant="outline">Read</span></span></label><label class="preset"><input class="ui-radio" type="radio" name="preset" value="reply"><span class="preset-title">Review and reply</span><span class="preset-desc">Everything in Look only, and answer or resolve comment threads.</span><span class="preset-scopes"><span class="ui-badge" data-variant="outline">Read</span><span class="ui-badge" data-variant="outline">Comment</span></span></label><label class="preset"><input class="ui-radio" type="radio" name="preset" value="full" checked><span class="preset-title">Publish and edit<span class="ui-badge" data-variant="secondary">Requested</span></span><span class="preset-desc">Everything above, and create artifacts, publish versions, edit files and write shared data.</span><span class="preset-scopes"><span class="ui-badge" data-variant="outline">Read</span><span class="ui-badge" data-variant="outline">Comment</span><span class="ui-badge" data-variant="outline">Publish and edit</span></span></label></fieldset><p class="ui-help" style="margin:-4px 0 0">Not granted: Share (not available for your role).</p><details class="custom"><summary>Choose exact access</summary><div class="scope"><input class="ui-checkbox" type="checkbox" id="s0" checked disabled style="margin-top:2px"><label class="ui-label" for="s0"><span style="font-weight:500">Read</span><small>Artifacts, files, comments and shared data</small></label></div><div class="scope"><input class="ui-checkbox" type="checkbox" id="s1" checked style="margin-top:2px"><label class="ui-label" for="s1"><span style="font-weight:500">Comment</span><small>Reply to and resolve comment threads</small></label></div><div class="scope"><input class="ui-checkbox" type="checkbox" id="s2" checked style="margin-top:2px"><label class="ui-label" for="s2"><span style="font-weight:500">Publish and edit</span><small>Create artifacts, publish versions, edit files, write shared data</small></label></div><div class="scope"><input class="ui-checkbox" type="checkbox" id="s3" disabled style="margin-top:2px"><label class="ui-label" for="s3"><span style="font-weight:500">Share</span><small>Create share links (not available for your role)</small></label></div></details><div class="redirect"><svg class="i" aria-hidden="true"><use href="../icons.svg#arrows"/></svg><span>You return to <b class="mono">http://localhost:33418/callback</b> after you decide. Approve only apps you started yourself.</span></div><div class="consent-actions" style="display:flex;justify-content:flex-end;gap:8px"><button class="ui-btn" data-variant="outline">Deny</button><button class="ui-btn" data-variant="default">Approve publish and edit</button></div></div></div></div></body></html>
