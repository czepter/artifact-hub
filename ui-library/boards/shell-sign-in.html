<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign-in</title><link rel="stylesheet" href="../_shared/css/tokens.css"><link rel="stylesheet" href="../_shared/css/components.css"><link rel="stylesheet" href="../_shared/css/shells.css"><link rel="stylesheet" href="../_shared/css/flows/core.css"><link rel="stylesheet" href="../_shared/css/flows/signin.css"><body><div class="shell-page" data-center><div class="signin"><div class="signin-id"><span class="shell-dot"></span><span>design.czpt.de · your Artifact Hub</span></div><div class="ui-card gate" style="max-width:none"><div class="ui-card-header"><h1 class="ui-card-title" style="font-size:18px">Sign in</h1></div><div class="ui-card-content stackf-lg"><div class="signin-alt"><button class="ui-btn" data-variant="outline"><svg class="i" aria-hidden="true"><use href="../icons.svg#key"/></svg>Sign in with a passkey</button><p class="signin-foot" style="text-align:left">Fastest: no typing, uses this device.</p></div><div class="or">or with e-mail</div><form class="stackf"><div class="ui-field"><label class="ui-label" for="e">E-mail</label><input id="e" class="ui-input" type="email" autocomplete="username webauthn" placeholder="you@example.com"></div><div class="ui-field"><label class="ui-label" for="p">Password</label><input id="p" class="ui-input" type="password" autocomplete="current-password"></div><button class="ui-btn" data-variant="default" style="width:100%">Sign in</button></form><div class="signin-alt"><button class="ui-btn" data-variant="ghost"><svg class="i" aria-hidden="true"><use href="../icons.svg#github"/></svg>Continue with GitHub</button></div></div></div><p class="signin-foot">New here? Sign-up is by invitation from the owner.</p></div></div></body></html>
